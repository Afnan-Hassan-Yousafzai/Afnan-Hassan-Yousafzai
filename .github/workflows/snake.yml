name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # THE LINUS TRICK:
            # We set the first color (0 commits) to #0e4429 (Dark Green) instead of Grey.
            # This makes the WHOLE board look green and active.
            dist/github-contribution-grid-snake.svg?color_snake=#ffffff&color_dots=#0e4429,#006d32,#26a641,#39d353,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#0e4429,#006d32,#26a641,#39d353,#216e39

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
